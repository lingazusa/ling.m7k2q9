const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(S),iterations:IT,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT));
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
const err=document.getElementById("err"), btn=document.querySelector("button");
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const pw=document.getElementById("pw").value; const rem=document.getElementById("rem").checked; btn.disabled=true; err.textContent="…";
  try{ await open_(pw); try{ if(rem) localStorage.setItem("gm_pw",pw); }catch(_){} }
  catch(x){ btn.disabled=false; err.textContent="密碼不正確 · Wrong password · Mali ang password"; }
});
(async()=>{ let pw=null; try{pw=localStorage.getItem("gm_pw");}catch(_){}
  if(pw){ try{ await open_(pw); }catch(_){ try{localStorage.removeItem("gm_pw");}catch(__){} } } })();
